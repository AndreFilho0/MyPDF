# Publica uma Release com o APK assinado quando uma tag vX.Y.Z é enviada:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Versão a partir da tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::A tag precisa ser no formato vX.Y.Z (ex.: v1.2.0). Veio: $GITHUB_REF_NAME"
            exit 1
          fi
          # 1.2.3 -> 10203: sempre cresce, então o Android aceita como atualização.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPDF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MYPDF_KEYSTORE_BASE64 não configurado. Veja a seção 'Publicar uma nova versão' do README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MYPDF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Testes e APK de release
        env:
          MYPDF_KEYSTORE_PASSWORD: ${{ secrets.MYPDF_KEYSTORE_PASSWORD }}
          MYPDF_KEY_ALIAS: ${{ secrets.MYPDF_KEY_ALIAS }}
          MYPDF_KEY_PASSWORD: ${{ secrets.MYPDF_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Preparar arquivos
        id: files
        run: |
          apk="MyPDF-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyPDF ${{ github.ref_name }}
          files: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
          generate_release_notes: true
          body: |
            ## Como instalar

            1. No celular Android (8.0 ou superior), baixe o arquivo **${{ steps.files.outputs.apk }}** (${{ steps.files.outputs.size }}) logo abaixo, em *Assets*.
            2. Abra o arquivo baixado. Se o Android pedir, permita **"Instalar apps desconhecidos"** para o navegador ou o gerenciador de arquivos.
            3. Toque em **Instalar**. Para atualizar uma versão anterior, é só instalar por cima: os PDFs gerados são mantidos.

            O app funciona totalmente offline e não pede permissão de internet.
