# Compila e roda os testes a cada push ou pull request na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes de unidade e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Guardar o APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: MyPDF-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
